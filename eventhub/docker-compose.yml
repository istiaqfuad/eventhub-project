version: '3.8'

# Local development compose. Mirrors the security posture of the root
# docker-compose.yml: infrastructure ports are loopback-only and require
# credentials. The database is local Postgres here (the root compose uses Neon).

services:
  postgres:
    image: postgres:15-alpine
    container_name: eventhub-postgres
    environment:
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub_password
      POSTGRES_DB: eventhub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eventhub-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: eventhub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?RABBITMQ_PASS must be set}
    ports:
      - "127.0.0.1:5672:5672"   # AMQP protocol port
      - "127.0.0.1:15672:15672" # Management UI
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: eventhub-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    # No host port: ES is unauthenticated, so keep it internal-only.
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: eventhub-minio
    environment:
      MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"   # API port
      - "127.0.0.1:9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  es_data:
  minio_data:
